{% extends "game/base.html" %}

{% block content %}

<section class="game-header">
    <div>
        <p class="eyebrow">Today's challenge</p>
        <h1>Guess the word.</h1>
        <p>Green means right. Orange means close. Five tries to make it click.</p>
    </div>
    <div class="game-limit"><strong>03</strong><span>games<br>today</span></div>
</section>

<section class="game-panel">
    <div class="game-toolbar">
        <button id="start-game" class="button button-primary" type="button">Start a new game <span aria-hidden="true">→</span></button>
        <p id="message" role="status">Your board is waiting.</p>
    </div>

    <div id="game-board" class="game-board" aria-live="polite"></div>

    <div class="guess-controls">
        <label for="guess">Your guess</label>

        <input type="text" id="guess" maxlength="5" minlength="5" pattern="[A-Za-z]{5}" autocomplete="off" placeholder="_____" required disabled>

        <button id="submit-guess" class="button button-dark" type="button" disabled>Submit guess</button>
    </div>
</section>

{% load static %}

<script src="{% static 'game/js/game.js' %}"></script>

{% endblock %}
