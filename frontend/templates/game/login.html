{% extends "game/base.html" %}

{% block content %}

<section class="form-layout">
    <div class="form-intro">
        <p class="eyebrow">Welcome back</p>
        <h1>Ready for<br><em>another guess?</em></h1>
        <p>Sign in and pick up your daily word challenge.</p>
    </div>

    <div class="form-card">
        <h2>Log in</h2>
        <p class="form-subtitle">Enter your details to continue.</p>

        <form id="login-form">

            <label for="username">Username</label>

            <input type="text" id="username" placeholder="Your username" required>

            <label for="password">Password</label>

            <input type="password" id="password" placeholder="Your password" required>

            <button class="button button-primary" type="submit">Login <span aria-hidden="true">→</span></button>
        </form>

        <p id="message" class="form-message" role="status"></p>
        <p class="form-footer">New here? <a href="/register/">Create an account</a></p>
    </div>
</section>

{% load static %}

<script src="{% static 'game/js/login.js' %}"></script>

{% endblock %}
